[workspace]
resolver = "2"
members = ["crates/eventing-contract", "crates/event-auth-jwt", "crates/event-context-reference", "examples/rust"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bookcicle/eventing-examples"
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
